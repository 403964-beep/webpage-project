<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0c4a6e" rx="16"/>
  <!-- Classroom Board -->
  <rect x="80" y="60" width="640" height="300" rx="14" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="110" fill="#7dd3fc" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Introduction to Modern Web Development</text>
  <text x="400" y="145" fill="#e0f2fe" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">Youth STEM Workshop & Coding Bootcamp</text>
  <!-- Interactive code snippet on board -->
  <rect x="140" y="170" width="520" height="150" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="170" y="210" fill="#38bdf8" font-family="monospace" font-size="15">function createWebpage() {</text>
  <text x="200" y="240" fill="#a7f3d0" font-family="monospace" font-size="15">  return { html, css, javascript };</text>
  <text x="170" y="270" fill="#38bdf8" font-family="monospace" font-size="15">}</text>
  <text x="170" y="300" fill="#94a3b8" font-family="monospace" font-size="13">// Mentoring 25+ aspiring high school programmers</text>
  <text x="400" y="415" fill="#f0f9ff" font-size="18" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Community STEM Mentorship Session</text>
  <text x="400" y="445" fill="#bae6fd" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">Hands-on guidance, algorithm coaching, and web fundamentals</text>
</svg>
