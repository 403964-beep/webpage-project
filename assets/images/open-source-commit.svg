<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a" rx="16"/>
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Header -->
  <circle cx="70" cy="75" r="6" fill="#ef4444"/>
  <circle cx="90" cy="75" r="6" fill="#eab308"/>
  <circle cx="110" cy="75" r="6" fill="#22c55e"/>
  <text x="140" y="80" fill="#94a3b8" font-size="14" font-family="monospace">git status - 540 Contributions in 2026</text>
  <!-- Git commits visualization -->
  <g transform="translate(60, 130)">
    <!-- Weeks Grid -->
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#1e3a8a"/>
    <rect x="25" y="0" width="18" height="18" rx="3" fill="#2563eb"/>
    <rect x="50" y="0" width="18" height="18" rx="3" fill="#3b82f6"/>
    <rect x="75" y="0" width="18" height="18" rx="3" fill="#60a5fa"/>
    <rect x="100" y="0" width="18" height="18" rx="3" fill="#2563eb"/>
    <rect x="125" y="0" width="18" height="18" rx="3" fill="#3b82f6"/>
    <rect x="150" y="0" width="18" height="18" rx="3" fill="#93c5fd"/>

    <rect x="0" y="25" width="18" height="18" rx="3" fill="#2563eb"/>
    <rect x="25" y="25" width="18" height="18" rx="3" fill="#60a5fa"/>
    <rect x="50" y="25" width="18" height="18" rx="3" fill="#3b82f6"/>
    <rect x="75" y="25" width="18" height="18" rx="3" fill="#1e3a8a"/>
    <rect x="100" y="25" width="18" height="18" rx="3" fill="#3b82f6"/>
    <rect x="125" y="25" width="18" height="18" rx="3" fill="#60a5fa"/>
    <rect x="150" y="25" width="18" height="18" rx="3" fill="#3b82f6"/>

    <rect x="0" y="50" width="18" height="18" rx="3" fill="#3b82f6"/>
    <rect x="25" y="50" width="18" height="18" rx="3" fill="#93c5fd"/>
    <rect x="50" y="50" width="18" height="18" rx="3" fill="#2563eb"/>
    <rect x="75" y="50" width="18" height="18" rx="3" fill="#60a5fa"/>
    <rect x="100" y="50" width="18" height="18" rx="3" fill="#3b82f6"/>
    <rect x="125" y="50" width="18" height="18" rx="3" fill="#2563eb"/>
    <rect x="150" y="50" width="18" height="18" rx="3" fill="#93c5fd"/>

    <rect x="0" y="75" width="18" height="18" rx="3" fill="#60a5fa"/>
    <rect x="25" y="75" width="18" height="18" rx="3" fill="#3b82f6"/>
    <rect x="50" y="75" width="18" height="18" rx="3" fill="#2563eb"/>
    <rect x="75" y="75" width="18" height="18" rx="3" fill="#93c5fd"/>
    <rect x="100" y="75" width="18" height="18" rx="3" fill="#60a5fa"/>
    <rect x="125" y="75" width="18" height="18" rx="3" fill="#3b82f6"/>
    <rect x="150" y="75" width="18" height="18" rx="3" fill="#2563eb"/>
  </g>
  <!-- Commit graph line -->
  <g transform="translate(300, 140)">
    <line x1="20" y1="30" x2="400" y2="30" stroke="#475569" stroke-width="4"/>
    <circle cx="60" cy="30" r="10" fill="#3b82f6"/>
    <circle cx="160" cy="30" r="10" fill="#10b981"/>
    <circle cx="260" cy="30" r="10" fill="#8b5cf6"/>
    <circle cx="360" cy="30" r="10" fill="#f59e0b"/>
    <text x="60" y="65" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">v1.0-alpha</text>
    <text x="160" y="65" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">core-api</text>
    <text x="260" y="65" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">admin-dash</text>
    <text x="360" y="65" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">v2.0-stable</text>
  </g>
  <text x="400" y="320" fill="#f8fafc" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Open-Source Developer Pipeline</text>
  <text x="400" y="355" fill="#94a3b8" font-size="15" font-family="system-ui, sans-serif" text-anchor="middle">Continuous Integration, Test Automation & Clean Branch Releases</text>
</svg>
