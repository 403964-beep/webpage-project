<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#312e81" rx="16"/>
  <!-- Poster border -->
  <rect x="60" y="40" width="680" height="420" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <text x="400" y="90" fill="#c7d2fe" font-size="24" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">AI & High-Performance Cloud Architecture</text>
  <text x="400" y="125" fill="#a5b4fc" font-size="15" font-family="system-ui, sans-serif" text-anchor="middle">Academic Symposium Poster • Senior Honors Showcase</text>
  <!-- Chart graphs on poster -->
  <g transform="translate(100, 160)">
    <rect width="280" height="180" rx="8" fill="#312e81" stroke="#4338ca"/>
    <text x="140" y="30" fill="#e0e7ff" font-size="13" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Latency Reduction (ms)</text>
    <rect x="30" y="120" width="40" height="40" fill="#6366f1" rx="4"/>
    <rect x="90" y="80" width="40" height="80" fill="#818cf8" rx="4"/>
    <rect x="150" y="50" width="40" height="110" fill="#a5b4fc" rx="4"/>
    <rect x="210" y="40" width="40" height="120" fill="#c7d2fe" rx="4"/>
  </g>
  <g transform="translate(420, 160)">
    <rect width="280" height="180" rx="8" fill="#312e81" stroke="#4338ca"/>
    <text x="140" y="30" fill="#e0e7ff" font-size="13" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">System Reliability</text>
    <circle cx="140" cy="105" r="50" fill="none" stroke="#4338ca" stroke-width="12"/>
    <circle cx="140" cy="105" r="50" fill="none" stroke="#38bdf8" stroke-width="12" stroke-dasharray="290" stroke-dashoffset="30"/>
    <text x="140" y="112" fill="#ffffff" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">99.9%</text>
  </g>
  <text x="400" y="395" fill="#e0e7ff" font-size="16" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Undergraduate Engineering Symposium Winner</text>
  <text x="400" y="425" fill="#a5b4fc" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">Peer-reviewed design and presentation on scalable web systems</text>
</svg>
