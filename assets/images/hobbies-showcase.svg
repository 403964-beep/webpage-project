<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg-grad)"/>
  <rect width="800" height="500" fill="url(#grid-pattern)"/>

  <!-- Glowing Ambiance -->
  <circle cx="200" cy="180" r="160" fill="#0284c7" opacity="0.12" filter="blur(40px)"/>
  <circle cx="600" cy="320" r="180" fill="#d97706" opacity="0.10" filter="blur(50px)"/>

  <!-- Central Badge / Heading Deck -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#38bdf8"/>
    <text x="32" y="21" fill="#e2e8f0" font-size="12" font-family="system-ui, sans-serif" font-weight="600" letter-spacing="0.5">PASSION &amp; PURSUIT</text>
  </g>

  <!-- Hobby Pillar 1: Athletics & Football -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="310" height="165" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="4" rx="2" fill="url(#accent-amber)"/>
    
    <!-- Sports Icon -->
    <rect x="20" y="24" width="44" height="44" rx="10" fill="#78350f" opacity="0.4"/>
    <circle cx="42" cy="46" r="14" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <path d="M 34 38 Q 42 46 34 54 M 50 38 Q 42 46 50 54 M 30 46 L 54 46" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

    <text x="76" y="42" fill="#f8fafc" font-size="16" font-family="system-ui, sans-serif" font-weight="700">Athletic Training &amp; Football</text>
    <text x="76" y="60" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Grossmont HS • Strength &amp; Speed</text>

    <!-- Stat Pills -->
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="80" height="24" rx="6" fill="#1e293b"/>
      <text x="40" y="16" fill="#fde68a" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Weight Room</text>
      
      <rect x="90" y="0" width="85" height="24" rx="6" fill="#1e293b"/>
      <text x="132" y="16" fill="#fde68a" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Speed Drills</text>

      <rect x="185" y="0" width="80" height="24" rx="6" fill="#1e293b"/>
      <text x="225" y="16" fill="#fde68a" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Film Study</text>
    </g>

    <text x="20" y="142" fill="#64748b" font-size="11.5" font-family="system-ui, sans-serif">Dedicated daily discipline to physical and mental conditioning.</text>
  </g>

  <!-- Hobby Pillar 2: Video Games & Esports -->
  <g transform="translate(430, 100)">
    <rect x="0" y="0" width="310" height="165" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="4" rx="2" fill="url(#accent-cyan)"/>
    
    <!-- Game Controller Icon -->
    <rect x="20" y="24" width="44" height="44" rx="10" fill="#0c4a6e" opacity="0.4"/>
    <rect x="28" y="38" width="28" height="16" rx="6" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
    <path d="M 33 46 L 37 46 M 35 44 L 35 48" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="47" cy="44" r="1.5" fill="#38bdf8"/>
    <circle cx="51" cy="48" r="1.5" fill="#38bdf8"/>

    <text x="76" y="42" fill="#f8fafc" font-size="16" font-family="system-ui, sans-serif" font-weight="700">Competitive Video Games</text>
    <text x="76" y="60" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Online Matches • Squad Play</text>

    <!-- Game Pill Badges -->
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="75" height="24" rx="6" fill="#1e293b"/>
      <text x="37" y="16" fill="#fca5a5" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Madden</text>
      
      <rect x="85" y="0" width="75" height="24" rx="6" fill="#1e293b"/>
      <text x="122" y="16" fill="#d8b4fe" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Fortnite</text>

      <rect x="170" y="0" width="95" height="24" rx="6" fill="#1e293b"/>
      <text x="217" y="16" fill="#fde68a" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">NBA 2K26</text>
    </g>

    <text x="20" y="142" fill="#64748b" font-size="11.5" font-family="system-ui, sans-serif">Running football playbooks, battle royale drops, and court hoops.</text>
  </g>

  <!-- Hobby Pillar 3: Basketball & Hoops -->
  <g transform="translate(60, 290)">
    <rect x="0" y="0" width="310" height="165" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="4" rx="2" fill="url(#accent-emerald)"/>
    
    <!-- Basketball Icon -->
    <rect x="20" y="24" width="44" height="44" rx="10" fill="#064e3b" opacity="0.4"/>
    <circle cx="42" cy="46" r="14" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <line x1="28" y1="46" x2="56" y2="46" stroke="#34d399" stroke-width="1.8"/>
    <line x1="42" y1="32" x2="42" y2="60" stroke="#34d399" stroke-width="1.8"/>

    <text x="76" y="42" fill="#f8fafc" font-size="16" font-family="system-ui, sans-serif" font-weight="700">Basketball &amp; Team Hoops</text>
    <text x="76" y="60" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Fast-Paced Courts &amp; Shooting Drills</text>

    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="90" height="24" rx="6" fill="#1e293b"/>
      <text x="45" y="16" fill="#a7f3d0" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Pickup Games</text>
      
      <rect x="100" y="0" width="75" height="24" rx="6" fill="#1e293b"/>
      <text x="137" y="16" fill="#a7f3d0" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Perimeter</text>

      <rect x="185" y="0" width="80" height="24" rx="6" fill="#1e293b"/>
      <text x="225" y="16" fill="#a7f3d0" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Footwork</text>
    </g>

    <text x="20" y="142" fill="#64748b" font-size="11.5" font-family="system-ui, sans-serif">Sharpening agility, spatial instincts, and teamwork on court.</text>
  </g>

  <!-- Hobby Pillar 4: Opponent Film Study & Strategy -->
  <g transform="translate(430, 290)">
    <rect x="0" y="0" width="310" height="165" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="4" rx="2" fill="url(#accent-purple)"/>
    
    <!-- Film & Strategy Video Icon -->
    <rect x="20" y="24" width="44" height="44" rx="10" fill="#581c87" opacity="0.4"/>
    <rect x="30" y="36" width="24" height="18" rx="3" fill="none" stroke="#c084fc" stroke-width="2"/>
    <polygon points="39,41 47,45 39,49" fill="#c084fc"/>

    <text x="76" y="42" fill="#f8fafc" font-size="16" font-family="system-ui, sans-serif" font-weight="700">Opponent Film Study</text>
    <text x="76" y="60" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Game Tape • Tendency Breakdown</text>

    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="85" height="24" rx="6" fill="#1e293b"/>
      <text x="42" y="16" fill="#e9d5ff" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Game Film</text>
      
      <rect x="95" y="0" width="85" height="24" rx="6" fill="#1e293b"/>
      <text x="137" y="16" fill="#e9d5ff" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Tendencies</text>

      <rect x="190" y="0" width="75" height="24" rx="6" fill="#1e293b"/>
      <text x="227" y="16" fill="#e9d5ff" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Coverage</text>
    </g>

    <text x="20" y="142" fill="#64748b" font-size="11.5" font-family="system-ui, sans-serif">Dissecting opponent formations and sharpening on-field football IQ.</text>
  </g>
</svg>
