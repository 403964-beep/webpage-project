      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#trophyGrad)" rx="16"/>
  <circle cx="400" cy="210" r="140" fill="#3b82f6" opacity="0.1"/>
  <!-- Trophy Cup -->
  <path d="M330 140 H470 V220 C470 260 440 290 400 290 C360 290 330 260 330 220 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="4"/>
  <path d="M330 160 C290 160 280 210 330 220" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <path d="M470 160 C510 160 520 210 470 220" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <!-- Base -->
  <rect x="385" y="290" width="30" height="40" fill="#d97706"/>
  <rect x="340" y="330" width="120" height="35" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
  <text x="400" y="353" fill="#f8fafc" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">FIRST PLACE</text>
  <!-- Ribbon and Stars -->
  <polygon points="400,180 405,195 420,195 408,205 412,220 400,210 388,220 392,205 380,195 395,195" fill="#ffffff"/>
  <!-- Badge text -->
  <text x="400" y="410" fill="#94a3b8" font-size="20" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Annual University Hackathon 2026</text>
  <text x="400" y="440" fill="#60a5fa" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">Best Engineering Architecture Award</text>
</svg>
